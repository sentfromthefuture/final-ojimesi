<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ojimesi Admin — Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d110e;
      --surface:   #141a15;
      --border:    #1f2b20;
      --green:     #4ade80;
      --green-dim: #1a3d22;
      --amber:     #fbbf24;
      --amber-dim: #3a2a00;
      --red:       #f87171;
      --red-dim:   #3a1010;
      --text:      #e8f0e9;
      --muted:     #6b7f6d;
      --mono:      'DM Mono', monospace;
      --serif:     'Fraunces', serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--green);
      letter-spacing: 0.02em;
    }

    .logo span { font-style: italic; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--green);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .stat-chips {
      display: flex;
      gap: 0.75rem;
    }

    .chip {
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      font-size: 0.72rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .chip strong { color: var(--text); }

    /* ── Filters ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.35rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }

    .toolbar-right {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Main ── */
    main {
      padding: 2rem 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Order Cards ── */
    #orders-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .order-card.new-flash {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(74,222,128,0.15);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .order-meta {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .order-id {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .order-contact {
      font-size: 0.9rem;
      color: var(--text);
    }

    .order-time {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .order-total {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--green);
    }

    /* Status badge */
    .status-badge {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.7rem;
      border-radius: 3px;
      font-weight: 500;
    }

    .status-badge.pending {
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber);
    }

    .status-badge.fulfilled {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green);
    }

    /* Items table */
    .card-body {
      padding: 1rem 1.25rem;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .items-table th {
      text-align: left;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .items-table td {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .items-table tr:last-child td { border-bottom: none; }

    .items-table td:last-child { text-align: right; color: var(--muted); }

    /* Card actions */
    .card-footer {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }

    .btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.15s;
    }

    .btn-fulfill {
      background: var(--green-dim);
      color: var(--green);
      border-color: var(--green);
    }

    .btn-fulfill:hover { background: var(--green); color: var(--bg); }

    .btn-delete {
      background: var(--red-dim);
      color: var(--red);
      border-color: var(--red);
    }

    .btn-delete:hover { background: var(--red); color: #fff; }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Empty / Loading states ── */
    .state-msg {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .state-msg .icon { font-size: 2.5rem; margin-bottom: 1rem; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--surface);
      border: 1px solid var(--green);
      color: var(--green);
      font-size: 0.8rem;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header, .toolbar, main { padding-left: 1rem; padding-right: 1rem; }
      .stat-chips { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Ojimesi <span>Admin</span></div>
  <div class="header-right">
    <div class="stat-chips">
      <div class="chip">Total orders: <strong id="stat-total">—</strong></div>
      <div class="chip">Pending: <strong id="stat-pending">—</strong></div>
      <div class="chip">Revenue: <strong id="stat-revenue">—</strong></div>
    </div>
    <div class="live-indicator">
      <div class="live-dot"></div>
      Live
    </div>
  </div>
</header>

<div class="toolbar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="pending">Pending</button>
  <button class="filter-btn" data-filter="fulfilled">Fulfilled</button>
  <div class="toolbar-right" id="order-count">Loading...</div>
</div>

<main>
  <div id="orders-list">
    <div class="state-msg"><div class="icon">🌿</div>Loading orders...</div>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wbmcbtgmnolubmmximhe.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWNidGdtbm9sdWJtbXhpbWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODA2NjEsImV4cCI6MjA5MjM1NjY2MX0.AZ1dfatnaouNww81-uII7ZZZWMqtwGYGaAGbuo87wfc';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  let allOrders = [];
  let currentFilter = 'all';

  // ── Helpers ──────────────────────────────────────
  function toast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
    el.style.color = isError ? 'var(--red)' : 'var(--green)';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function shortId(id) {
    return '#' + String(id).slice(0, 8).toUpperCase();
  }

  // ── Render ───────────────────────────────────────
  function renderOrders() {
    const list = document.getElementById('orders-list');
    const filtered = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);

    document.getElementById('order-count').textContent =
      `${filtered.length} order${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      list.innerHTML = `<div class="state-msg"><div class="icon">🌱</div>No ${currentFilter === 'all' ? '' : currentFilter} orders yet.</div>`;
      return;
    }

    list.innerHTML = '';
    filtered.forEach(order => list.appendChild(buildCard(order)));
    updateStats();
  }

  function buildCard(order, isNew = false) {
    const items = Array.isArray(order.items) ? order.items : [];
    const status = order.status || 'pending';

    const card = document.createElement('div');
    card.className = 'order-card' + (isNew ? ' new-flash' : '');
    card.dataset.id = order.id;

    if (isNew) setTimeout(() => card.classList.remove('new-flash'), 3000);

    card.innerHTML = `
      <div class="card-header">
        <div class="order-meta">
          <span class="order-id">${shortId(order.id)}</span>
          <span class="order-contact">📞 ${order.contact || '—'}</span>
          <span class="order-time">${formatTime(order.created_at)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <span class="status-badge ${status}">${status}</span>
          <span class="order-total">K${Number(order.total).toFixed(2)}</span>
        </div>
      </div>
      <div class="card-body">
        <table class="items-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Unit price</th>
              <th>Qty</th>
              <th>Line total</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.name}</td>
                <td>K${Number(i.price).toFixed(2)}</td>
                <td>${i.qty}</td>
                <td>K${(i.price * i.qty).toFixed(2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="card-footer">
        <button class="btn btn-fulfill" data-id="${order.id}"
          ${status === 'fulfilled' ? 'disabled' : ''}>
          ${status === 'fulfilled' ? '✓ Fulfilled' : 'Mark fulfilled'}
        </button>
        <button class="btn btn-delete" data-id="${order.id}">Delete</button>
      </div>
    `;

    // Fulfill
    card.querySelector('.btn-fulfill').addEventListener('click', () => fulfillOrder(order.id));
    // Delete
    card.querySelector('.btn-delete').addEventListener('click', () => deleteOrder(order.id));

    return card;
  }

  function updateStats() {
    const total   = allOrders.length;
    const pending = allOrders.filter(o => (o.status || 'pending') === 'pending').length;
    const revenue = allOrders
      .filter(o => o.status === 'fulfilled')
      .reduce((s, o) => s + Number(o.total), 0);

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-revenue').textContent = `K${revenue.toFixed(2)}`;
  }

  // ── Actions ──────────────────────────────────────
  async function fulfillOrder(id) {
    const btn = document.querySelector(`.btn-fulfill[data-id="${id}"]`);
    if (btn) btn.disabled = true;

    const { error } = await db.from('orders').update({ status: 'fulfilled' }).eq('id', id);
    if (error) { toast('Failed to update order', true); return; }

    const order = allOrders.find(o => o.id === id);
    if (order) order.status = 'fulfilled';
    renderOrders();
    toast('Order marked as fulfilled ✓');
  }

  async function deleteOrder(id) {
    if (!confirm('Delete this order? This cannot be undone.')) return;

    const { error } = await db.from('orders').delete().eq('id', id);
    if (error) { toast('Failed to delete order', true); return; }

    allOrders = allOrders.filter(o => o.id !== id);
    renderOrders();
    toast('Order deleted');
  }

  // ── Load ─────────────────────────────────────────
  async function loadOrders() {
    const { data, error } = await db
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('orders-list').innerHTML =
        `<div class="state-msg"><div class="icon">⚠️</div>Failed to load orders: ${error.message}</div>`;
      return;
    }

    allOrders = data || [];
    renderOrders();
  }

  // ── Realtime ─────────────────────────────────────
  db.channel('orders-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, (payload) => {
      allOrders.unshift(payload.new);
      renderOrders();
      // Flash the new card
      const newCard = document.querySelector(`.order-card[data-id="${payload.new.id}"]`);
      if (newCard) newCard.classList.add('new-flash');
      toast('🌿 New order received!');
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, (payload) => {
      const i = allOrders.findIndex(o => o.id === payload.new.id);
      if (i !== -1) allOrders[i] = payload.new;
      renderOrders();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'orders' }, (payload) => {
      allOrders = allOrders.filter(o => o.id !== payload.old.id);
      renderOrders();
    })
    .subscribe();

  // ── Filters ──────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderOrders();
    });
  });

  // ── Init ─────────────────────────────────────────
  loadOrders();
</script>
</body>
</html>
